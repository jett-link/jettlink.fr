<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" role="img" aria-labelledby="title desc">
<title id="title">Acheminement des colis depuis Bordeaux vers la Guyane et la Martinique</title>
<desc id="desc">Les colis arrivent à Bordeaux, en Gironde, puis sont expédiés par bateau vers la Guyane et la Martinique.</desc>
<defs>
 <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.3" fill="#8dbbd0" opacity=".45"/></pattern>
 <linearGradient id="sea" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#eaf7fc"/><stop offset="1" stop-color="#c9e7f4"/></linearGradient>
 <linearGradient id="land" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#78b2cf"/><stop offset="1" stop-color="#4d91b5"/></linearGradient>
 <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#17445e" flood-opacity=".18"/></filter>
</defs>
<rect width="900" height="600" rx="28" fill="url(#sea)"/><rect width="900" height="600" rx="28" fill="url(#dots)"/>
<g fill="none" stroke="#8dbbd0" opacity=".28"><circle cx="300" cy="275" r="170"/><circle cx="300" cy="275" r="225"/><circle cx="300" cy="275" r="280"/></g>
<!-- France -->
<path d="M112 190 145 153 185 145 208 112 246 119 270 98 304 120 342 117 365 145 403 159 411 195 439 216 426 249 443 277 423 307 392 318 378 353 344 360 320 394 281 385 258 414 224 401 203 369 168 365 151 334 123 323 116 288 92 264 104 232Z" fill="url(#land)" stroke="#4f91b2" stroke-width="3"/>
<path d="M278 118 306 128 321 151 306 168 280 159 263 139Z" fill="#b8d9e8" opacity=".9"/>
<!-- South America coast -->
<path d="M505 392 552 377 605 388 647 411 680 444 704 481 734 514 754 560 734 600H420L438 558 455 522 459 483 478 446Z" fill="#a6cfe2" opacity=".62"/>
<!-- French Guiana highlight -->
<path d="M625 393 657 398 678 421 672 449 646 458 620 444 612 418Z" fill="#4f98bb" stroke="#397f9f" stroke-width="3"/>
<!-- Martinique island -->
<path d="M744 244 756 233 765 247 758 267 747 276 739 261Z" fill="#4f98bb" stroke="#397f9f" stroke-width="2"/>
<!-- routes -->
<path d="M300 258 C420 190 555 194 748 250" fill="none" stroke="#f47c42" stroke-width="7" stroke-linecap="round" stroke-dasharray="15 16"/>
<path d="M300 258 C390 320 486 385 640 420" fill="none" stroke="#f47c42" stroke-width="7" stroke-linecap="round" stroke-dasharray="15 16"/>
<!-- ships -->
<g transform="translate(510 202) rotate(5)" filter="url(#shadow)">
 <path d="M-43 20H50L37 39H-27Z" fill="#123e5d"/><rect x="-25" y="-2" width="19" height="22" rx="2" fill="#fff"/><rect x="-4" y="0" width="19" height="18" rx="2" fill="#f47c42"/><rect x="17" y="0" width="18" height="18" rx="2" fill="#2e82a9"/><path d="M-22 -2V-17H-9V-2" fill="#fff" stroke="#123e5d" stroke-width="2"/><path d="M-35 43q12 8 24 0t24 0t24 0" fill="none" stroke="#62a9c8" stroke-width="4" stroke-linecap="round"/>
</g>
<g transform="translate(465 354) rotate(25)" filter="url(#shadow)">
 <path d="M-43 20H50L37 39H-27Z" fill="#123e5d"/><rect x="-25" y="-2" width="19" height="22" rx="2" fill="#fff"/><rect x="-4" y="0" width="18" height="18" rx="2" fill="#f47c42"/><rect x="16" y="0" width="18" height="18" rx="2" fill="#2e82a9"/><path d="M-22 -2V-17H-9V-2" fill="#fff" stroke="#123e5d" stroke-width="2"/><path d="M-35 43q12 8 24 0t24 0t24 0" fill="none" stroke="#62a9c8" stroke-width="4" stroke-linecap="round"/>
</g>
<!-- location pins -->
<g filter="url(#shadow)"><circle cx="300" cy="258" r="22" fill="#123e5d"/><circle cx="300" cy="258" r="13" fill="#fff"/><circle cx="300" cy="258" r="8" fill="#f47c42"/>
<circle cx="752" cy="256" r="19" fill="#123e5d"/><circle cx="752" cy="256" r="11" fill="#fff"/><circle cx="752" cy="256" r="6" fill="#f47c42"/>
<circle cx="646" cy="425" r="19" fill="#123e5d"/><circle cx="646" cy="425" r="11" fill="#fff"/><circle cx="646" cy="425" r="6" fill="#f47c42"/></g>
<!-- labels -->
<g font-family="Arial, sans-serif" font-weight="800" fill="#123e5d">
 <rect x="220" y="292" width="160" height="43" rx="12" fill="#fff" stroke="#d4e8f1"/><text x="300" y="319" text-anchor="middle" font-size="18">BORDEAUX</text><text x="300" y="351" text-anchor="middle" font-size="12" letter-spacing="2" fill="#52768b">GIRONDE · 33</text>
 <rect x="690" y="290" width="188" height="42" rx="12" fill="#fff" stroke="#d4e8f1"/><text x="784" y="317" text-anchor="middle" font-size="17">MARTINIQUE</text>
