<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 900" role="img" aria-labelledby="title desc">
<title id="title">Départ de Bordeaux vers la Guyane et la Martinique</title>
<desc id="desc">Les colis sont réceptionnés à Bordeaux, en Gironde, puis acheminés par deux lignes maritimes distinctes : une vers la Martinique et une vers la Guyane. Un bateau est représenté sur chaque trajet.</desc>
<defs>
 <linearGradient id="sea" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#e8f7ff"/><stop offset="1" stop-color="#8bd5f2"/></linearGradient>
 <linearGradient id="land" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#28a2ce"/><stop offset="1" stop-color="#0876aa"/></linearGradient>
 <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse"><circle cx="3" cy="3" r="1.7" fill="#54b8e1" opacity=".55"/></pattern>
 <filter id="shadow" x="-35%" y="-35%" width="170%" height="180%"><feDropShadow dx="0" dy="7" stdDeviation="7" flood-color="#17445e" flood-opacity=".2"/></filter>
 <g id="ship" filter="url(#shadow)">
  <path d="M-56 20H62L43 48H-35Z" fill="#123e67"/>
  <path d="M-37 20V-14H-5V20Z" fill="#fff" stroke="#123e67" stroke-width="3"/>
  <path d="M-27 -5h7v7h-7zm13 0h7v7h-7zm-13 13h7v7h-7zm13 0h7v7h-7z" fill="#1b5c89"/>
  <path d="M2 20V-4H33V20Z" fill="#f47b35"/><path d="M36 20V-1H54V20Z" fill="#238ab8"/>
  <path d="M-44 56q14 9 28 0t28 0t28 0t28 0" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round"/>
  <path d="M-43 65q14 7 28 0t28 0t28 0t28 0" fill="none" stroke="#5cb7dc" stroke-width="4" stroke-linecap="round"/>
 </g>
</defs>
<rect width="900" height="900" rx="34" fill="url(#sea)"/>
<rect width="900" height="900" rx="34" fill="url(#dots)"/>
<g fill="none" stroke="#68b9df" stroke-width="2" opacity=".25">
 <circle cx="335" cy="430" r="170"/><circle cx="335" cy="430" r="250"/><circle cx="335" cy="430" r="330"/>
</g>
<!-- France métropolitaine -->
<path d="M72 294 104 260 143 249 166 216 201 221 228 191 264 205 292 184 323 207 360 204 384 230 418 247 425 279 454 302 444 335 461 364 443 393 415 406 397 438 365 444 343 477 307 469 284 498 249 485 226 454 194 448 177 420 149 408 142 375 117 351 128 320Z" fill="url(#land)" stroke="#fff" stroke-width="4"/>
<path d="M290 202l27 11 14 23-15 18-27-8-16-22z" fill="#8bd0e8" opacity=".9"/>
<!-- Amérique du Sud, repère Guyane -->
<path d="M565 522 613 504 660 520 700 547 728 584 751 623 775 667 793 712 772 763 741 800 691 823 642 816 603 790 580 749 553 708 540 662 546 618Z" fill="#9ed7e9" opacity=".45"/>
<path d="M661 521 698 531 723 557 718 592 687 612 656 600 642 568Z" fill="#0876aa" stroke="#fff" stroke-width="3"/>
<!-- Martinique -->
<path d="M752 290 769 276 783 293 779 318 764 334 750 316Z" fill="#0876aa" stroke="#fff" stroke-width="3"/>
<!-- Deux lignes maritimes distinctes depuis Bordeaux -->
<path d="M265 365 C390 270 548 260 758 306" fill="none" stroke="#f47b35" stroke-width="9" stroke-linecap="round" stroke-dasharray="18 17"/>
<path d="M265 365 C390 448 510 540 673 564" fill="none" stroke="#f47b35" stroke-width="9" stroke-linecap="round" stroke-dasharray="18 17"/>
<!-- Un bateau sur chaque ligne -->
<use href="#ship" transform="translate(526 283) rotate(4) scale(.9)"/>
<use href="#ship" transform="translate(488 496) rotate(19) scale(.9)"/>
<!-- Points d'arrivée et de départ -->
<g filter="url(#shadow)">
 <circle cx="265" cy="365" r="29" fill="#123e67"/><circle cx="265" cy="365" r="20" fill="#fff"/><circle cx="265" cy="365" r="12" fill="#f47b35"/>
 <circle cx="766" cy="306" r="27" fill="#123e67"/><circle cx="766" cy="306" r="18" fill="#fff"/><circle cx="766" cy="306" r="11" fill="#f47b35"/>
 <circle cx="680" cy="568" r="27" fill="#123e67"/><circle cx="680" cy="568" r="18" fill="#fff"/><circle cx="680" cy="568" r="11" fill="#f47b35"/>
</g>
<!-- Libellés -->
<g font-family="Arial,Helvetica,sans-serif" font-weight="800" text-anchor="middle">
 <rect x="170" y="405" width="195" height="78" rx="22" fill="#073b70"/>
 <text x="267" y="439" font-size="25" fill="#fff">BORDEAUX</text><text x="267" y="467" font-size="20" fill="#fff">(Gironde)</text>
 <rect x="670" y="348" width="214" height="56" rx="20" fill="#073b70"/><text x="777" y="385" font-size="24" fill="#fff">MARTINIQUE</text>
 <rect x="615" y="625" width="155" height="56" rx="20" fill="#073b70"/><text x="692" y="662" font-size="25" fill="#fff">GUYANE</text>
</g>
</svg>